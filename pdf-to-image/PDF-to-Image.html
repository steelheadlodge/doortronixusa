<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF to Image</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs" type="module"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1a1f24;
      --muted: #5b6773;
      --accent: #0b6bcb;
      --border: #d8dee6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 16px 48px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type="file"], select, input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { margin-top: 14px; color: var(--muted); min-height: 1.4em; }
    progress { width: 100%; margin-top: 10px; }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>PDF to JPEG / PNG</h1>
      <p class="sub">Open this file in Chrome or Edge on Windows. Needs internet once to load the converter.</p>

      <label for="pdf">PDF file</label>
      <input id="pdf" type="file" accept="application/pdf,.pdf" />

      <div class="row">
        <div>
          <label for="format">Format</label>
          <select id="format">
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPEG</option>
          </select>
        </div>
        <div>
          <label for="scale">Quality</label>
          <select id="scale">
            <option value="1">Normal (72 DPI)</option>
            <option value="2" selected>High (144 DPI)</option>
            <option value="3">Print (216 DPI)</option>
          </select>
        </div>
      </div>

      <button id="go" type="button">Convert &amp; download</button>
      <progress id="bar" max="100" value="0" hidden></progress>
      <div class="status" id="status"></div>
      <p class="hint">Each page downloads as its own image. Allow multiple downloads if the browser asks.</p>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

    const pdfInput = document.getElementById("pdf");
    const formatEl = document.getElementById("format");
    const scaleEl = document.getElementById("scale");
    const go = document.getElementById("go");
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");

    function downloadDataUrl(dataUrl, filename) {
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      a.click();
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    go.addEventListener("click", async () => {
      const file = pdfInput.files[0];
      if (!file) {
        status.textContent = "Choose a PDF first.";
        return;
      }

      go.disabled = true;
      bar.hidden = false;
      bar.value = 0;
      status.textContent = "Loading PDF…";

      try {
        const data = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data }).promise;
        const mime = formatEl.value;
        const ext = mime === "image/jpeg" ? "jpg" : "png";
        const scale = Number(scaleEl.value);
        const stem = file.name.replace(/\.pdf$/i, "") || "page";

        for (let i = 1; i <= pdf.numPages; i++) {
          status.textContent = `Converting page ${i} of ${pdf.numPages}…`;
          bar.value = ((i - 1) / pdf.numPages) * 100;
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
          const dataUrl = canvas.toDataURL(mime, 0.92);
          const num = String(i).padStart(3, "0");
          downloadDataUrl(dataUrl, `${stem}-page-${num}.${ext}`);
          await sleep(250);
        }

        bar.value = 100;
        status.textContent = `Saved ${pdf.numPages} image(s) to your Downloads folder.`;
      } catch (err) {
        status.textContent = "Conversion failed: " + (err && err.message ? err.message : err);
      } finally {
        go.disabled = false;
      }
    });
  </script>
</body>
</html>
