<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Doortronix USA</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body data-page="account">
  <div class="topbar">Factory-Direct from Malakoff, Texas</div>
  <nav class="nav"><div class="nav-inner">
    <a href="../index.html" class="brand">Doortronix<span>USA</span></a>
    <div class="nav-links" id="nav-links"></div>
  </div></nav>
  <div class="wrap">
    <h1>Account</h1>
    <p class="lead">Company details and the pricing Doortronix has assigned to you.</p>
    <div class="card">
      <h2>Your net</h2>
      <p id="ac_disc">—</p>
      <p class="muted" id="ac_dep"></p>
      <p class="muted">Discounts are set by Doortronix. You cannot change them here.</p>
    </div>
    <div class="card">
      <h2>Contact</h2>
      <form id="account-form">
        <label for="ac_name">Name</label>
        <input id="ac_name" required>
        <label for="ac_company">Company</label>
        <input id="ac_company" required>
        <label for="ac_email">Email</label>
        <input id="ac_email" disabled>
        <label for="ac_phone">Phone</label>
        <input id="ac_phone" type="tel">
        <div class="ok hidden" id="ac_ok">Saved.</div>
        <div class="err" id="ac_err"></div>
        <button class="btn btn-primary" type="submit" style="margin-top:16px">Save</button>
      </form>
    </div>
  </div>
  <script src="js/portal.js"></script>
</body>
</html>
