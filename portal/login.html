<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Doortronix USA</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body data-page="auth">
  <div class="topbar">Factory-Direct from Malakoff, Texas</div>
  <nav class="nav"><div class="nav-inner">
    <a href="../index.html" class="brand">Doortronix<span>USA</span></a>
    <div class="nav-links" id="nav-links"></div>
  </div></nav>
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="lead">Pay, track fabrication and shipping, open confirmation drawings, and reorder.</p>
    <form id="login-form">
      <label for="li_email">Email</label>
      <input id="li_email" type="email" required autocomplete="email">
      <label for="li_password">Password</label>
      <input id="li_password" type="password" required autocomplete="current-password">
      <div class="err" id="li_err"></div>
      <button class="btn btn-primary btn-wide" type="submit">Sign In</button>
    </form>
    <p class="muted" style="margin-top:16px;text-align:center;">No account yet? <a href="signup.html">Create one</a> — published contractor net until we assign a distributor discount.</p>
  </div>
  <script src="js/portal.js"></script>
</body>
</html>
